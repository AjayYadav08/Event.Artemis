
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Artemis</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8f9fa;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      font-feature-settings: 'kern' 1, 'liga' 1, 'calt' 1;
      /* Prevent paint flashing on scroll */
      overscroll-behavior: none;
    }

    /* Promote interactive elements to their own compositor layer */
    button, a, [role="button"] {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    /* Ensure smooth GPU-composited transforms on all transitioning elements */
    .transition-all, .transition-transform, .transition-colors, .transition-opacity {
      will-change: auto;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #e2e8f0;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #cbd5e1;
    }

    /* Smooth scroll inside overflow containers */
    [class*="overflow-y-auto"],
    [class*="overflow-x-auto"] {
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    /* No scrollbar utility */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* Prevent layout shift on image load */
    img {
      display: block;
      max-width: 100%;
    }

    /* Your Teams Button Hover Style (Matches reference screenshot) */
    #tour-teams-tab:hover {
      background-color: #EEEFF3 !important;
      border-color: #DDE0E5 !important;
    }
    #tour-teams-tab:hover .teams-tab-text {
      color: #15191D !important;
    }
    #tour-teams-tab:hover .teams-tab-arrow {
      opacity: 1 !important;
      transform: scale(1) !important;
    }
    #tour-teams-tab .teams-tab-arrow {
      opacity: 0.25;
      transform: scale(1);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Subtle, Theme-Matching Loading Shimmer Animations */
    @keyframes shimmer-sweep {
      0% {
        background-position: -200% 0;
      }
      100% {
        background-position: 200% 0;
      }
    }

    .shimmer-animated {
      background: linear-gradient(
        90deg,
        #f1f5f9 0%,
        #e2e8f0 45%,
        #cbd5e1 50%,
        #e2e8f0 55%,
        #f1f5f9 100%
      );
      background-size: 200% 100%;
      animation: shimmer-sweep 2.2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    .shimmer-card {
      background: linear-gradient(
        90deg,
        #ffffff 0%,
        #f8fafc 40%,
        #f1f5f9 50%,
        #f8fafc 60%,
        #ffffff 100%
      );
      background-size: 200% 100%;
      animation: shimmer-sweep 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes shimmer-bar {
      0% {
        transform: translateX(-100%);
      }
      50% {
        transform: translateX(0%);
      }
      100% {
        transform: translateX(100%);
      }
    }

    .shimmer-progress-bar {
      animation: shimmer-bar 1.6s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    /* Option 5: Blueprint Tech Matrix Background for Team Chat */
    .bg-blueprint-grid {
      background-color: #F8FAFC;
      background-image: linear-gradient(to right, rgba(148, 163, 184, 0.12) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(148, 163, 184, 0.12) 1px, transparent 1px);
      background-size: 24px 24px;
    }
  </style>

</head>
<body class="overflow-hidden">
  <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
